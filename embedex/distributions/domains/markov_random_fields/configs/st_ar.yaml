model:
  embedding:
    block_type: set_transformer
    embedding_dim: 32
    hidden_size: 128
    num_rounds: 3
    num_heads: 4
    num_inducing: 16
  generator:
    flow_type: ar
    ar_num_classes: 2
    ar_token_dim: 48
    ar_num_heads: 4
    ar_num_layers: 5
    ar_ff_multiplier: 4

training:
  learning_rate: 1e-3
  end_learning_rate: 1e-5
  warmup_steps: 1000
  num_iterations: 100000
  batch_size: 32
  num_samples: 512
  seed: 0

data:
  num_spins: 12
  num_states: 2
  coupling_scale: 1.0
  bias_scale: 0.5
  graph_type: random_edge_fixed_prob
  edge_prob: 0.5

evaluation:
  num_eval_distributions: 256
  num_eval_samples: 256
  num_logprob_evals: 8

run_name: ar
seed: 0
