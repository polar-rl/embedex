model:
  embedding:
    block_type: set_transformer
    embedding_dim: 32
    hidden_size: 128
    num_rounds: 3
    num_heads: 4
    num_inducing: 16
  generator:
    flow_type: dfm
    conditioning: concat
    dfm_num_classes: 2
    dfm_hidden_size: 200
    dfm_num_layers: 6
    dfm_time_embed_dim: 16
    dfm_num_steps: 200

training:
  learning_rate: 1e-3
  end_learning_rate: 1e-5
  warmup_steps: 1000
  num_iterations: 100000
  batch_size: 32
  num_samples: 512
  seed: 0

data:
  num_spins: 12
  num_states: 2
  coupling_scale: 1.0
  bias_scale: 0.5
  graph_type: random_edge_fixed_prob
  edge_prob: 0.5

run_name: dfm
seed: 0
