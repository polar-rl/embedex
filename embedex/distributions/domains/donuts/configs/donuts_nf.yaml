run_name: donuts_nf
seed: 0

model:
  embedding:
    block_type: set_transformer
    embedding_dim: 16
    hidden_size: 128
    num_rounds: 3
    num_heads: 4
    num_inducing: 16
  generator:
    flow_type: nf
    conditioning: concat
    nf_hidden_size: 32
    nf_num_layers: 3
    nf_num_coupling_layers: 8

training:
  learning_rate: 1e-3
  num_iterations: 100000
  batch_size: 64
  num_samples: 128
  seed: 0

evaluation:
  interpolation: true
  embedding_visualization: true
  parallelogram: true
